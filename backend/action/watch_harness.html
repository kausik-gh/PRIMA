<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PRIMA isolation harness</title>
  <style>
    :root {
      --ledger: #E8EBEF;
      --surface: #FFFFFF;
      --ink: #16202B;
      --graphite: #5A6875;
      --steel: #1F5C8C;
      --hairline: #D2D8DF;
      --t0: #3E7C5A;
      --t4: #5A3596;
      --t4-bg: #EEE8F7;
      --font-ui: "IBM Plex Sans", "Palatino Linotype", Palatino, "Times New Roman", serif;
      --font-data: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: var(--font-ui);
      background: var(--ledger);
      color: var(--ink);
      line-height: 1.45;
    }
    .chrome {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--hairline);
      background: var(--surface);
      font-size: 0.8125rem;
      color: var(--graphite);
    }
    .mark { color: var(--ink); font-weight: 600; letter-spacing: 0.04em; }
    .idle, .after {
      padding: 72px 24px 24px;
      max-width: 440px;
    }
    .idle h1, .after p {
      font-size: 1.375rem;
      font-weight: 600;
      line-height: 1.3;
      margin: 0 0 8px;
    }
    .idle p { margin: 0; color: var(--graphite); }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 48px;
      font-size: 0.8125rem;
      color: var(--graphite);
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--hairline);
    }
    .dot.on { background: var(--t0); }
    .sheet {
      position: fixed;
      inset: 0;
      background: var(--t4-bg);
      color: var(--ink);
      padding: 32px 24px 24px;
      display: flex;
      flex-direction: column;
      transform: translateY(100%);
      transition: transform 240ms ease;
      box-shadow: 0 1px 2px rgba(22,32,43,.08);
    }
    .sheet.open { transform: translateY(0); }
    @media (prefers-reduced-motion: reduce) {
      .sheet { transition: none; }
    }
    .lead { font-size: 1.0625rem; margin: 0 0 8px; font-weight: 600; }
    .amount {
      font-family: var(--font-data);
      font-size: clamp(2.5rem, 12vw, 3.25rem);
      font-weight: 500;
      line-height: 1.1;
      margin: 0 0 8px;
      font-variant-numeric: tabular-nums;
    }
    .sub { margin: 0 0 32px; }
    .facts {
      list-style: none;
      padding: 0;
      margin: 0 0 auto;
    }
    .facts li {
      padding: 12px 0;
      border-top: 1px solid var(--hairline);
    }
    .actions { display: flex; flex-direction: column; gap: 12px; padding-top: 24px; }
    button {
      font-family: inherit;
      font-size: 1rem;
      padding: 14px 16px;
      border-radius: 8px;
      cursor: pointer;
    }
    button:focus-visible {
      outline: 2px solid var(--steel);
      outline-offset: 2px;
    }
    .hold {
      background: var(--t4);
      color: #fff;
      border: 0;
    }
    .fine {
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--ink);
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <header class="chrome">
    <span class="mark">PRIMA isolation harness — not the product surface.</span>
    <span>Demo ledger</span>
  </header>
  <main>
    <section class="idle" id="idle">
      <h1 id="watching">You're watching for someone.</h1>
      <p>Nothing needs you right now.</p>
      <div class="status">
        <span class="dot" id="dot"></span>
        <span id="conn">connecting</span>
      </div>
    </section>
    <section class="after hidden" id="after">
      <p id="after-line"></p>
    </section>
  </main>
  <section class="sheet" id="sheet" hidden>
    <p class="lead" id="lead"></p>
    <p class="amount" id="amount"></p>
    <p class="sub" id="sub"></p>
    <ul class="facts" id="facts"></ul>
    <div class="actions">
      <button type="button" class="hold" id="btn-hold">Something's wrong — hold it</button>
      <button type="button" class="fine" id="btn-fine">This is fine</button>
    </div>
  </section>
  <script id="boot" type="application/json">__BOOT_JSON__</script>
  <script>
    const boot = JSON.parse(document.getElementById("boot").textContent);
    const watching = document.getElementById("watching");
    const idle = document.getElementById("idle");
    const after = document.getElementById("after");
    const afterLine = document.getElementById("after-line");
    const sheet = document.getElementById("sheet");
    const lead = document.getElementById("lead");
    const amount = document.getElementById("amount");
    const sub = document.getElementById("sub");
    const facts = document.getElementById("facts");
    const dot = document.getElementById("dot");
    const conn = document.getElementById("conn");
    watching.textContent = "You're watching for " + boot.account_holder + ".";

    let socket = null;

    function setConnected(on) {
      dot.classList.toggle("on", on);
      conn.textContent = on ? "connected" : "connecting";
    }

    function showIdle() {
      idle.classList.remove("hidden");
      after.classList.add("hidden");
      sheet.classList.remove("open");
      sheet.hidden = true;
    }

    function showFired(data) {
      const first = String(data.account_holder || "").trim().split(/\s+/)[0];
      lead.textContent = first + " is about to send";
      amount.textContent = data.amount;
      sub.textContent = "to an account opened " + data.payee_age_days + " days ago.";
      facts.replaceChildren();
      (data.facts || []).forEach(function (text) {
        const li = document.createElement("li");
        li.textContent = text;
        facts.appendChild(li);
      });
      idle.classList.add("hidden");
      after.classList.add("hidden");
      sheet.hidden = false;
      sheet.classList.add("open");
      document.getElementById("btn-hold").focus();
      try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) {}
    }

    function showAck(action) {
      afterLine.textContent = action === "hold"
        ? "You asked us to keep holding."
        : "You said this is fine.";
      sheet.classList.remove("open");
      sheet.hidden = true;
      idle.classList.add("hidden");
      after.classList.remove("hidden");
    }

    function sendAck(action) {
      if (!socket || socket.readyState !== WebSocket.OPEN) return;
      socket.send(JSON.stringify({ type: "circuit_breaker.ack", action: action }));
    }

    document.getElementById("btn-hold").addEventListener("click", function () {
      sendAck("hold");
    });
    document.getElementById("btn-fine").addEventListener("click", function () {
      sendAck("approved");
    });

    function connect() {
      const proto = location.protocol === "https:" ? "wss:" : "ws:";
      socket = new WebSocket(proto + "//" + location.host + "/ws/watch/" + encodeURIComponent(boot.token));
      socket.onopen = function () { setConnected(true); };
      socket.onclose = function () { setConnected(false); };
      socket.onmessage = function (event) {
        var msg = JSON.parse(event.data);
        if (msg.type === "snapshot") {
          setConnected(true);
        } else if (msg.type === "circuit_breaker.fired") {
          showFired(msg.data);
        } else if (msg.type === "circuit_breaker.acked") {
          showAck(msg.data.ack_action);
        }
      };
    }

    showIdle();
    connect();
  </script>
</body>
</html>
